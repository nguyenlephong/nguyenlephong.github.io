name: Admin insight snapshot

# MEP-90: refresh the password-gated /admin snapshot at adminVault/{ADMIN_VAULT_ID}.
# Secrets: FIREBASE_SERVICE_ACCOUNT_NGUYENLEPHONG_CV (needs Cloud Datastore User),
# ADMIN_VAULT_ID, POSTHOG_PERSONAL_API_KEY. Variables: POSTHOG_PROJECT_ID, optional POSTHOG_HOST.

on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Write admin snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Until the owner sets ADMIN_VAULT_ID the scheduled run is a no-op, not a failure.
      VAULT_CONFIGURED: ${{ secrets.ADMIN_VAULT_ID != '' }}
    steps:
      - name: Skip until configured
        if: env.VAULT_CONFIGURED != 'true'
        run: echo "::notice::ADMIN_VAULT_ID is not set; skipping the admin snapshot."

      - name: Checkout
        if: env.VAULT_CONFIGURED == 'true'
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        if: env.VAULT_CONFIGURED == 'true'
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      # Workflow-only, pinned install: the site and its CI never pull the Admin SDK.
      - name: Install Firebase Admin SDK
        if: env.VAULT_CONFIGURED == 'true'
        run: >
          npm install --prefix "$RUNNER_TEMP/admin-snapshot-deps"
          --no-save --no-audit --no-fund --ignore-scripts
          firebase-admin@14.5.0

      - name: Write snapshot
        if: env.VAULT_CONFIGURED == 'true'
        env:
          ADMIN_SNAPSHOT_DEPS: ${{ runner.temp }}/admin-snapshot-deps
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NGUYENLEPHONG_CV }}
          ADMIN_VAULT_ID: ${{ secrets.ADMIN_VAULT_ID }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ vars.POSTHOG_PROJECT_ID }}
          POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: node scripts/write-admin-snapshot.mjs
